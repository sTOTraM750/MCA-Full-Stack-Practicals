
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Student Registration Form</h1>
        <p>Please enter your details below.</p>

        <form action="#" method="get" class="registration-form">

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"
                   class="form-control" placeholder="Enter your full name"
                   required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   class="form-control" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
                   class="form-control" placeholder="example@email.com"
                   required>

            <fieldset>
                <legend>Gender</legend>

                <label class="inline-label">
                    <input type="radio" id="male" name="gender" value="Male" required>
                    Male
                </label>

                <label class="inline-label">
                    <input type="radio" id="female" name="gender" value="Female">
                    Female
                </label>

                <label class="inline-label">
                    <input type="radio" id="other" name="gender" value="Other">
                    Other
                </label>
            </fieldset>

            <fieldset>
                <legend>Interests</legend>

                <label class="inline-label">
                    <input type="checkbox" id="coding" name="interests" value="Coding">
                    Coding
                </label>

                <label class="inline-label">
                    <input type="checkbox" id="gaming" name="interests" value="Gaming">
                    Gaming
                </label>

                <label class="inline-label">
                    <input type="checkbox" id="sports" name="interests" value="Sports">
                    Sports
                </label>
            </fieldset>

            <label for="course">Select Course:</label>
            <select id="course" name="course" class="form-control" required>
                <option value="">-- Select a Course --</option>
                <option value="MCA">Master of Computer Applications</option>
                <option value="MBA">Master of Business Administration</option>
                <option value="MSc">Master of Science</option>
                <option value="MCom">Master of Commerce</option>
            </select>

            <label for="address">Address:</label>
            <textarea id="address" name="address" class="form-control"
                      rows="4" placeholder="Enter your address"></textarea>

            <div class="button-group">
                <button type="submit">Submit</button>
                <button type="reset" class="reset-button">Reset</button>
            </div>

        </form>
    </main>

</body>
</html>
